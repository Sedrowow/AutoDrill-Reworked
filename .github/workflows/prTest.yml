name: Pull Request Testing

on: [pull_request]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: temurin

    - name: Set up Android build tools
      run: |
        ANDROID_BUILD_TOOLS=$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1)
        echo "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}" >> $GITHUB_PATH
    - name: Build mod jar
      run: ./gradlew deploy
    - name: Upload built jar file
      uses: actions/upload-artifact@v3
      with:
        name: ${{ github.event.repository.name }} Pull Request
        path: build/libs/${{ github.event.repository.name }}.jar
